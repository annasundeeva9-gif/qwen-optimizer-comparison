raw:
  hf_dataset_id: Elriggs/openwebtext-100k
  hf_dataset_url: https://huggingface.co/datasets/Elriggs/openwebtext-100k
  hf_split: train
  text_column: text
  dir: outputs/datasets/raw/openwebtext_100k
  save_local: true
  force_reload: false

preprocessing:
  dir: outputs/datasets/preprocessed/openwebtext_100k
  save_local: false
  force_reload: false

split:
  dir: outputs/datasets/split_raw/openwebtext_100k
  validation_size: 0.05
  seed: 42
  save_local: true
  force_reload: false

tokenization:
  dir: outputs/datasets/tokenized/openwebtext_100k
  max_length: 1024
  min_length_tokens: 100
  num_proc: false
  save_local: true
  force_reload: false

final:
  dir: outputs/datasets/final/openwebtext_100k
  save_local: true
  force_reload: false
