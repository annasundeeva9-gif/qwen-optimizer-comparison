[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optimizer-comparison"
version = "0.1.0"
description = "Research pipeline for comparing AdamW and Muon optimizers on Qwen2.5-0.5B fine-tuning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=0.30",
    "datasets>=2.19",
    "hydra-core>=1.3",
    "lm_eval>=0.4",
    "mlflow>=2.12",
    "omegaconf>=2.3",
    "torch>=2.3",
    "transformers>=4.40",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
